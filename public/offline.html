<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b14" />
  <title>Sin conexión — MisFinanzas</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b14;color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif;padding:24px}
    .card{max-width:380px;text-align:center;padding:36px 28px;border-radius:20px;background:rgba(22,30,48,.6);border:1px solid rgba(148,163,184,.15);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}
    img{width:72px;height:72px;border-radius:18px;margin-bottom:18px}
    h1{font-size:20px;margin:0 0 8px}
    p{color:#94a3b8;font-size:14px;line-height:1.5;margin:0 0 22px}
    button{background:#11c48b;color:#04130d;border:0;border-radius:12px;padding:11px 22px;font-weight:600;font-size:14px;cursor:pointer}
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="Logo de MisFinanzas" />
    <h1>Estás sin conexión</h1>
    <p>MisFinanzas necesita internet para mostrar tus datos actualizados. Revisá tu conexión e intentá de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
